<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-do</title>
  <meta name="description" content="A clean, simple to-do list. Add tasks, set priorities and due dates, and check them off.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232F4BFF'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

  <style>
    /* ---------- Tokens ---------- */
    :root {
      --bg: #F1F3F0;
      --surface: #FFFFFF;
      --surface-2: #F6F7F5;
      --ink: #18202B;
      --muted: #667080;
      --line: #DCE0DA;
      --accent: #2F4BFF;
      --accent-ink: #FFFFFF;
      --accent-soft: #E8ECFF;
      --high: #D64545;
      --med: #C98512;
      --low: #2F9363;
      --shadow: 0 1px 2px rgba(24, 32, 43, .06), 0 14px 32px -18px rgba(24, 32, 43, .28);
      --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
      --font-body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
      color-scheme: light;
    }
    :root:not([data-theme="light"]) {
      /* overridden below for dark preference */
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0F1319;
        --surface: #181E26;
        --surface-2: #1E2530;
        --ink: #E9EDF2;
        --muted: #909BAA;
        --line: #2B3440;
        --accent: #7E90FF;
        --accent-ink: #0D1220;
        --accent-soft: #232B4A;
        --high: #F07A7A;
        --med: #E5AE4A;
        --low: #55C48C;
        --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 14px 32px -18px rgba(0, 0, 0, .7);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0F1319;
      --surface: #181E26;
      --surface-2: #1E2530;
      --ink: #E9EDF2;
      --muted: #909BAA;
      --line: #2B3440;
      --accent: #7E90FF;
      --accent-ink: #0D1220;
      --accent-soft: #232B4A;
      --high: #F07A7A;
      --med: #E5AE4A;
      --low: #55C48C;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 14px 32px -18px rgba(0, 0, 0, .7);
      color-scheme: dark;
    }

    /* ---------- Base ---------- */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .app {
      width: min(640px, 100% - 32px);
      margin: 0 auto;
      padding: 56px 0 72px;
    }

    /* ---------- Header ---------- */
    .top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }
    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(2rem, 6vw, 2.75rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }
    .summary {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: .98rem;
    }
    .theme-btn {
      flex: none;
      width: 40px; height: 40px;
      display: grid; place-items: center;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: var(--muted);
      transition: color .15s, border-color .15s;
    }
    .theme-btn:hover { color: var(--ink); border-color: var(--muted); }
    .theme-btn svg { width: 18px; height: 18px; }
    .theme-btn .sun { display: none; }
    :root[data-theme="dark"] .theme-btn .sun { display: block; }
    :root[data-theme="dark"] .theme-btn .moon { display: none; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .theme-btn .sun { display: block; }
      :root:not([data-theme="light"]) .theme-btn .moon { display: none; }
    }

    .progress {
      margin: 22px 0 28px;
      height: 6px;
      border-radius: 999px;
      background: var(--line);
      overflow: hidden;
    }
    .progress > span {
      display: block;
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: var(--accent);
      transition: width .5s cubic-bezier(.2, .8, .2, 1);
    }

    /* ---------- Add form ---------- */
    .composer {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 14px;
      display: grid;
      gap: 12px;
    }
    .composer-main {
      display: flex;
      gap: 10px;
    }
    .composer input[type="text"] {
      flex: 1;
      min-width: 0;
      height: 46px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface-2);
      font-size: 1rem;
    }
    .composer input[type="text"]::placeholder { color: var(--muted); }
    .composer input[type="text"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .add-btn {
      height: 46px;
      padding: 0 20px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 600;
      transition: transform .1s, filter .15s;
    }
    .add-btn:hover { filter: brightness(1.08); }
    .add-btn:active { transform: scale(.97); }

    .composer-opts {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .field {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      padding: 0 10px 0 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: .875rem;
    }
    .field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .field select, .field input {
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: .875rem;
      outline: none;
      padding: 0;
    }
    .field select { cursor: pointer; padding-right: 2px; }
    .field select option { color: #18202B; }

    /* ---------- Toolbar ---------- */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 28px 0 12px;
      flex-wrap: wrap;
    }
    .filters {
      display: inline-flex;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
    }
    .filters button {
      height: 32px;
      padding: 0 14px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      font-size: .9rem;
      font-weight: 500;
      transition: background .15s, color .15s;
    }
    .filters button:hover { color: var(--ink); }
    .filters button[aria-pressed="true"] {
      background: var(--accent-soft);
      color: var(--accent);
    }
    .filters .count { margin-left: 6px; font-variant-numeric: tabular-nums; opacity: .75; }
    .clear-btn {
      border: 0;
      background: none;
      color: var(--muted);
      font-size: .9rem;
      padding: 6px 4px;
      border-radius: 6px;
    }
    .clear-btn:hover { color: var(--high); }
    .clear-btn[hidden] { display: none; }

    /* ---------- Task list ---------- */
    .tasks {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }
    .task {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 12px 12px 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 4px solid var(--prio, var(--line));
      border-radius: 14px;
      transition: border-color .15s, opacity .2s;
    }
    .task[data-priority="high"] { --prio: var(--high); }
    .task[data-priority="medium"] { --prio: var(--med); }
    .task[data-priority="low"] { --prio: var(--low); }
    .task.done { --prio: var(--line); }
    .task.done .title { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }
    .task.done .meta { opacity: .6; }

    .check { position: relative; flex: none; display: grid; place-items: center; width: 24px; height: 24px; cursor: pointer; }
    .check input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
    .box {
      width: 22px; height: 22px;
      border: 2px solid var(--muted);
      border-radius: 7px;
      display: grid; place-items: center;
      transition: background .15s, border-color .15s, transform .15s;
    }
    .box svg { width: 14px; height: 14px; stroke: var(--accent-ink); opacity: 0; transform: scale(.6); transition: opacity .15s, transform .15s; }
    .check input:checked + .box { background: var(--accent); border-color: var(--accent); }
    .check input:checked + .box svg { opacity: 1; transform: scale(1); }
    .check input:active + .box { transform: scale(.9); }
    .check input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }

    .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .title { overflow-wrap: anywhere; font-weight: 500; }
    .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .8125rem; color: var(--muted); }
    .meta .overdue { color: var(--high); font-weight: 500; }
    .edit-input {
      width: 100%;
      height: 34px;
      padding: 0 10px;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: var(--surface-2);
      box-shadow: 0 0 0 3px var(--accent-soft);
      outline: none;
    }

    .actions { display: flex; gap: 2px; flex: none; }
    .icon-btn {
      width: 34px; height: 34px;
      display: grid; place-items: center;
      border: 0; border-radius: 9px;
      background: transparent;
      color: var(--muted);
      transition: background .15s, color .15s;
    }
    .icon-btn svg { width: 17px; height: 17px; }
    .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
    .icon-btn.danger:hover { color: var(--high); }
    @media (hover: hover) {
      .actions { opacity: 0; transition: opacity .15s; }
      .task:hover .actions, .task:focus-within .actions { opacity: 1; }
    }

    /* ---------- Empty state ---------- */
    .empty {
      text-align: center;
      padding: 44px 24px;
      border: 1.5px dashed var(--line);
      border-radius: 16px;
      color: var(--muted);
    }
    .empty strong { display: block; color: var(--ink); font-family: var(--font-display); font-size: 1.15rem; margin-bottom: 4px; }

    .foot { margin-top: 36px; text-align: center; color: var(--muted); font-size: .8125rem; }

    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    @media (max-width: 520px) {
      .app { padding-top: 36px; }
      .composer-main { flex-direction: column; }
      .add-btn { width: 100%; }
      .toolbar { justify-content: center; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="top">
        <div>
          <h1 id="today">Today</h1>
          <p class="summary" id="summary" aria-live="polite"></p>
        </div>
        <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch colour theme">
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
      <div class="progress" role="progressbar" aria-label="Tasks completed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><span id="progressFill"></span></div>
    </header>

    <form class="composer" id="form" autocomplete="off">
      <div class="composer-main">
        <label class="sr-only" for="newTask">New task</label>
        <input type="text" id="newTask" placeholder="What needs doing?" maxlength="200" required>
        <button class="add-btn" type="submit">Add task</button>
      </div>
      <div class="composer-opts">
        <label class="field">Priority
          <select id="newPriority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </label>
        <label class="field">Due
          <input type="date" id="newDue">
        </label>
      </div>
    </form>

    <div class="toolbar">
      <div class="filters" role="group" aria-label="Filter tasks" id="filters">
        <button type="button" data-filter="all" aria-pressed="true">All<span class="count" id="cAll">0</span></button>
        <button type="button" data-filter="active" aria-pressed="false">To do<span class="count" id="cActive">0</span></button>
        <button type="button" data-filter="done" aria-pressed="false">Done<span class="count" id="cDone">0</span></button>
      </div>
      <button class="clear-btn" id="clearBtn" type="button" hidden>Clear completed</button>
    </div>

    <ul class="tasks" id="list"></ul>

    <p class="foot">Double-click a task to rename it. Your tasks are saved in this browser.</p>
  </main>

  <script>
    (function () {
      'use strict';

      var STORE_KEY = 'todo.tasks.v1';
      var THEME_KEY = 'todo.theme.v1';
      var tasks = [];
      var filter = 'all';
      var editingId = null;

      var $ = function (id) { return document.getElementById(id); };
      var list = $('list'), form = $('form'), input = $('newTask');

      var ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
      var ICON_EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
      var ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>';

      /* ---------- Storage ---------- */
      function load() {
        try {
          var raw = localStorage.getItem(STORE_KEY);
          var parsed = raw ? JSON.parse(raw) : [];
          tasks = Array.isArray(parsed) ? parsed : [];
        } catch (e) { tasks = []; }
      }
      function save() {
        try { localStorage.setItem(STORE_KEY, JSON.stringify(tasks)); } catch (e) { /* storage unavailable */ }
      }
      function uid() {
        return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
      }

      /* ---------- Dates ---------- */
      function todayStr() {
        var d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      }
      function dayDiff(dateStr) {
        var p = dateStr.split('-').map(Number);
        var due = new Date(p[0], p[1] - 1, p[2]);
        var now = new Date(); now.setHours(0, 0, 0, 0);
        return Math.round((due - now) / 86400000);
      }
      function dueLabel(dateStr, done) {
        var diff = dayDiff(dateStr);
        var p = dateStr.split('-').map(Number);
        var pretty = new Date(p[0], p[1] - 1, p[2]).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
        if (done) return { text: 'Due ' + pretty, overdue: false };
        if (diff < 0) return { text: 'Overdue, ' + pretty, overdue: true };
        if (diff === 0) return { text: 'Due today', overdue: false };
        if (diff === 1) return { text: 'Due tomorrow', overdue: false };
        return { text: 'Due ' + pretty, overdue: false };
      }
      var PRIORITY_LABEL = { high: 'High priority', medium: 'Medium priority', low: 'Low priority' };

      /* ---------- Render ---------- */
      function render() {
        var total = tasks.length;
        var doneCount = tasks.filter(function (t) { return t.done; }).length;
        var activeCount = total - doneCount;

        $('cAll').textContent = total;
        $('cActive').textContent = activeCount;
        $('cDone').textContent = doneCount;
        $('clearBtn').hidden = doneCount === 0;

        var pct = total ? Math.round((doneCount / total) * 100) : 0;
        $('progressFill').style.width = pct + '%';
        $('progress').setAttribute('aria-valuenow', pct);
        $('summary').textContent = total === 0
          ? 'Nothing planned yet.'
          : activeCount === 0
            ? 'All ' + total + ' ' + (total === 1 ? 'task' : 'tasks') + ' done. Nice work.'
            : activeCount + (activeCount === 1 ? ' task' : ' tasks') + ' left, ' + doneCount + ' done';

        var visible = tasks.filter(function (t) {
          return filter === 'all' || (filter === 'active' ? !t.done : t.done);
        });

        list.innerHTML = '';

        if (visible.length === 0) {
          var li = document.createElement('li');
          li.className = 'empty';
          var msg = {
            all: ['Your list is clear', 'Add your first task above to get started.'],
            active: ['Nothing left to do', 'Add a new task or check the Done tab.'],
            done: ['No completed tasks yet', 'Tick off a task and it will show up here.']
          }[filter];
          li.innerHTML = '<strong></strong><span></span>';
          li.firstChild.textContent = msg[0];
          li.lastChild.textContent = msg[1];
          list.appendChild(li);
          return;
        }

        visible.forEach(function (t) {
          var li = document.createElement('li');
          li.className = 'task' + (t.done ? ' done' : '');
          li.dataset.id = t.id;
          li.dataset.priority = t.priority;

          var check = document.createElement('label');
          check.className = 'check';
          check.innerHTML = '<input type="checkbox"><span class="box">' + ICON_CHECK + '</span>';
          var cb = check.querySelector('input');
          cb.checked = t.done;
          cb.setAttribute('aria-label', (t.done ? 'Mark as not done: ' : 'Mark as done: ') + t.text);
          cb.dataset.action = 'toggle';

          var body = document.createElement('div');
          body.className = 'body';

          if (editingId === t.id) {
            var ed = document.createElement('input');
            ed.type = 'text';
            ed.className = 'edit-input';
            ed.value = t.text;
            ed.maxLength = 200;
            ed.setAttribute('aria-label', 'Edit task');
            ed.dataset.edit = t.id;
            body.appendChild(ed);
          } else {
            var title = document.createElement('span');
            title.className = 'title';
            title.textContent = t.text;
            title.dataset.action = 'edit';
            body.appendChild(title);

            var meta = document.createElement('span');
            meta.className = 'meta';
            var pr = document.createElement('span');
            pr.textContent = PRIORITY_LABEL[t.priority] || '';
            meta.appendChild(pr);
            if (t.due) {
              var info = dueLabel(t.due, t.done);
              var d = document.createElement('span');
              d.textContent = info.text;
              if (info.overdue) d.className = 'overdue';
              meta.appendChild(d);
            }
            body.appendChild(meta);
          }

          var actions = document.createElement('div');
          actions.className = 'actions';
          actions.innerHTML =
            '<button type="button" class="icon-btn" data-action="edit" aria-label="Edit task">' + ICON_EDIT + '</button>' +
            '<button type="button" class="icon-btn danger" data-action="delete" aria-label="Delete task">' + ICON_TRASH + '</button>';

          li.appendChild(check);
          li.appendChild(body);
          li.appendChild(actions);
          list.appendChild(li);
        });

        var active = list.querySelector('.edit-input');
        if (active) { active.focus(); active.select(); }
      }

      /* ---------- Actions ---------- */
      function addTask(text, priority, due) {
        tasks.unshift({ id: uid(), text: text, priority: priority, due: due || '', done: false, created: Date.now() });
        save(); render();
      }
      function toggleTask(id) {
        tasks.forEach(function (t) { if (t.id === id) t.done = !t.done; });
        save(); render();
      }
      function deleteTask(id) {
        tasks = tasks.filter(function (t) { return t.id !== id; });
        save(); render();
      }
      function commitEdit(id, value) {
        var text = value.trim();
        if (text) tasks.forEach(function (t) { if (t.id === id) t.text = text; });
        editingId = null;
        save(); render();
      }

      /* ---------- Events ---------- */
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var text = input.value.trim();
        if (!text) { input.focus(); return; }
        addTask(text, $('newPriority').value, $('newDue').value);
        input.value = '';
        $('newDue').value = '';
        input.focus();
      });

      list.addEventListener('change', function (e) {
        if (e.target.dataset.action === 'toggle') {
          toggleTask(e.target.closest('.task').dataset.id);
        }
      });

      list.addEventListener('click', function (e) {
        var el = e.target.closest('[data-action]');
        if (!el || el.dataset.action === 'toggle') return;
        var item = el.closest('.task');
        if (!item) return;
        if (el.dataset.action === 'delete') deleteTask(item.dataset.id);
        if (el.dataset.action === 'edit' && el.tagName === 'BUTTON') { editingId = item.dataset.id; render(); }
      });

      list.addEventListener('dblclick', function (e) {
        var title = e.target.closest('.title');
        if (!title) return;
        editingId = title.closest('.task').dataset.id;
        render();
      });

      list.addEventListener('keydown', function (e) {
        if (!e.target.classList.contains('edit-input')) return;
        if (e.key === 'Enter') { e.preventDefault(); commitEdit(e.target.dataset.edit, e.target.value); }
        if (e.key === 'Escape') { editingId = null; render(); }
      });

      list.addEventListener('focusout', function (e) {
        if (e.target.classList && e.target.classList.contains('edit-input') && editingId === e.target.dataset.edit) {
          commitEdit(e.target.dataset.edit, e.target.value);
        }
      });

      $('filters').addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-filter]');
        if (!btn) return;
        filter = btn.dataset.filter;
        $('filters').querySelectorAll('button').forEach(function (b) {
          b.setAttribute('aria-pressed', String(b === btn));
        });
        render();
      });

      $('clearBtn').addEventListener('click', function () {
        tasks = tasks.filter(function (t) { return !t.done; });
        save(); render();
      });

      /* ---------- Theme ---------- */
      function currentTheme() {
        var set = document.documentElement.getAttribute('data-theme');
        if (set) return set;
        return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      try {
        var savedTheme = localStorage.getItem(THEME_KEY);
        if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.setAttribute('data-theme', savedTheme);
      } catch (e) {}
      $('themeBtn').addEventListener('click', function () {
        var next = currentTheme() === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
      });

      /* ---------- Init ---------- */
      $('today').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
      $('newDue').min = todayStr();
      load();
      render();
    })();
  </script>
</body>
</html>
